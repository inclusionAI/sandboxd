name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

  vet:
    name: Go vet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: make check-fmt

      - name: Run go vet
        run: make vet

  storage:
    name: Storage integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils xfsprogs

      - name: Prepare storage kernel modules
        run: |
          sudo modprobe loop
          sudo modprobe xfs
          sudo modprobe erofs

      - name: Run privileged storage tests
        run: make storage-test

  runtime-e2e-build:
    name: Runtime E2E binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev

      - name: Build runtime E2E binaries
        run: make e2e-runtime-binaries

      - name: Pack runtime E2E binaries
        run: |
          tar -czf output/sandboxd-e2e-binaries.tar.gz \
            -C output \
            sandboxd \
            sbox \
            runc-shim \
            sandbox-logger \
            firecracker-agent \
            oom-hog \
            network-policy-client

      - name: Upload runtime E2E binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandboxd-e2e-binaries
          path: output/sandboxd-e2e-binaries.tar.gz
          compression-level: 0
          retention-days: 1

  runtime-e2e:
    name: Runtime E2E (${{ matrix.name }})
    needs: runtime-e2e-build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: runsc-systrap
            needs_kvm: false
          - name: runsc-kvm
            needs_kvm: true
          - name: kata
            needs_kvm: true
          - name: firecracker
            needs_kvm: true
          - name: runc
            needs_kvm: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download runtime E2E binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sandboxd-e2e-binaries
          path: output

      - name: Unpack runtime E2E binaries
        run: |
          tar -xzf output/sandboxd-e2e-binaries.tar.gz -C output

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpu-checker

      - name: Prepare network and filesystem prerequisites
        run: |
          sudo modprobe erofs
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          test -c /dev/net/tun

      - name: Verify nested KVM
        if: matrix.needs_kvm
        run: |
          sudo modprobe kvm
          sudo chmod 0666 /dev/kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          sudo kvm-ok

      - name: Run runtime E2E
        env:
          E2E_CASE: ${{ matrix.name }}
        run: make e2e-runtime-case

  protobuf:
    name: Generated protobuf bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify generated protobuf bindings
        run: make check-protos

  bpf:
    name: Generated BPF objects
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check BPF C formatting
        run: make check-bpf-format

      - name: Verify generated BPF bindings and objects
        run: make check-bpf-generated

  networkacl:
    name: Network dataplane
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare network ACL kernel prerequisites
        run: |
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1

      - name: Run privileged network ACL tests
        run: make networkacl-test

      - name: Run privileged bpfnat tests
        run: make bpfnat-test
