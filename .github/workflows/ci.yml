name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          make test GOTEST="go test -json" | tee "$RUNNER_TEMP/unit-tests.jsonl"
          test_status=${PIPESTATUS[0]}
          set -e
          python3 - "$RUNNER_TEMP/unit-tests.jsonl" <<'PY'
          import json
          import sys

          reported = set()
          with open(sys.argv[1]) as output:
              for line in output:
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  if event.get("Action") not in ("fail", "build-fail"):
                      continue
                  target = event.get("Package", event.get("ImportPath", "unknown package"))
                  if event.get("Test"):
                      target += "/" + event["Test"]
                  if target in reported:
                      continue
                  reported.add(target)
                  target = target.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=Go test failed::" + target)
          PY
          exit "$test_status"

      - name: Verify offline PVM qualification and stage guards
        run: |
          python3 test/e2e/test_pvm_l1.py -v
          python3 test/e2e/test_pvm_request.py -v
          python3 test/e2e/test_redis_stage.py -v

      - name: Verify gVisor archive installer
        run: |
          bash -n third_party/install-gvisor.sh
          python3 third_party/test_install_gvisor.py -v

  vet:
    name: Go vet
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: make check-fmt

      - name: Run go vet
        run: make vet

  storage:
    name: Storage integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils xfsprogs fuse3

      - name: Prepare storage kernel modules
        run: |
          sudo modprobe loop
          sudo modprobe xfs
          sudo modprobe erofs
          sudo modprobe fuse
          test -c /dev/fuse

      - name: Run privileged storage tests
        run: make storage-test

      - name: Download pinned distill-fs release
        run: |
          source third_party/runtime-versions.env
          mkdir -p output/distill-fs
          archive=output/distill-fs/release.tar.gz
          curl --fail --location --retry 3 "$DISTILL_FS_AMD64_URL" -o "$archive"
          echo "$DISTILL_FS_AMD64_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C output/distill-fs distill_fs
          test "$(output/distill-fs/distill_fs --version)" = "distill_fs ${DISTILL_FS_RELEASE#v}"

      - name: Run distill-fs integration
        run: make distillfs-test

  runtime-e2e-build:
    name: Runtime E2E binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev

      - name: Build runtime E2E binaries
        run: make e2e-runtime-binaries

      - name: Pack runtime E2E binaries
        run: |
          tar -czf output/sandboxd-e2e-binaries.tar.gz \
            -C output \
            sandboxd \
            sbox \
            runc-shim \
            sandbox-logger \
            firecracker-agent \
            oom-hog \
            network-policy-client \
            checkpoint-restore

      - name: Upload runtime E2E binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandboxd-e2e-binaries
          path: output/sandboxd-e2e-binaries.tar.gz
          compression-level: 0
          retention-days: 1

  runtime-e2e:
    name: Runtime E2E (${{ matrix.name }})
    needs: runtime-e2e-build
    runs-on: ${{ matrix.runner || 'ubuntu-22.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: runsc-systrap
            needs_kvm: false
          - name: runsc-kvm
            needs_kvm: true
          - name: runsc-reflink
            needs_kvm: false
            needs_reflink: true
            runner: ubuntu-24.04
          - name: kata
            needs_kvm: true
          - name: firecracker
            needs_kvm: true
          - name: firecracker-incremental
            needs_kvm: true
            checkpoint_mode: incremental
          - name: firecracker-virtiofs
            needs_kvm: true
          - name: runc
            needs_kvm: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download runtime E2E binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sandboxd-e2e-binaries
          path: output

      - name: Unpack runtime E2E binaries
        run: |
          tar -xzf output/sandboxd-e2e-binaries.tar.gz -C output

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpu-checker
          extra_modules="linux-modules-extra-$(uname -r)"
          if apt-cache show "${extra_modules}" >/dev/null 2>&1; then
            sudo apt-get install -y "${extra_modules}"
          fi

      - name: Prepare network and filesystem prerequisites
        run: |
          sudo modprobe erofs
          sudo modprobe br_netfilter
          sudo modprobe ip6_tables
          sudo modprobe ip6table_filter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1
          test -c /dev/net/tun

      - name: Verify nested KVM
        if: matrix.needs_kvm
        run: |
          sudo modprobe kvm
          sudo chmod 0666 /dev/kvm
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          sudo kvm-ok

      - name: Prepare shared XFS fixture for filestore reflinks
        if: matrix.needs_reflink
        run: |
          sudo apt-get install -y xfsprogs
          sudo modprobe loop
          sudo modprobe xfs
          truncate -s 6G "${RUNNER_TEMP}/reflink-home.img"
          sudo mkfs.xfs -f -m reflink=1 "${RUNNER_TEMP}/reflink-home.img"
          mkdir -p "${RUNNER_TEMP}/reflink-home"
          sudo mount -o loop "${RUNNER_TEMP}/reflink-home.img" "${RUNNER_TEMP}/reflink-home"
          sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/reflink-home"
          echo "E2E_HOME_FIXTURE_PARENT=${RUNNER_TEMP}/reflink-home" >>"${GITHUB_ENV}"

      - name: Run runtime E2E
        env:
          E2E_CASE: ${{ matrix.name }}
          E2E_FIRECRACKER_CHECKPOINT_MODE: ${{ matrix.checkpoint_mode }}
        run: make e2e-runtime-case

      - name: Release XFS fixture
        if: always() && matrix.needs_reflink
        run: |
          if mountpoint -q "${RUNNER_TEMP}/reflink-home"; then
            sudo umount "${RUNNER_TEMP}/reflink-home"
          fi

  protobuf:
    name: Generated protobuf bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify generated protobuf bindings
        run: make check-protos

  bpf:
    name: Generated BPF objects
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check BPF C formatting
        run: make check-bpf-format

      - name: Verify generated BPF bindings and objects
        run: make check-bpf-generated

  networkacl:
    name: Network dataplane
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare network ACL kernel prerequisites
        run: |
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1

      - name: Run privileged network ACL tests
        run: make networkacl-test

      - name: Run privileged bpfnat tests
        run: make bpfnat-test
