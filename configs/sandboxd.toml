rootDir = "/var/lib/sandboxd/root"
storeDir = "/var/lib/sandboxd/store"

[plugin.network]
ip_range = "10.88.0.1/24"
# Use "bpfnat" on nodes that cannot provide iptables. The BPF object is
# embedded in sandboxd. Host setup must set net.ipv4.ip_forward=1 and, when
# local DNAT is enabled, net.ipv4.conf.all.rp_filter=0.
nat_backend = "iptables"
# Optional: override the IPv4 default-route device selected by bpfnat.
# bpfnat_device = "eth0"
# Enable only when a trusted frontend shares sandboxd's network namespace and
# must reach forwarded sandbox ports through a local address.
enable_local_dnat = false
# Enable dynamic per-sandbox IPv4 and DNS policies. This manages sandbox
# resolv.conf files and listens on sandbox0 TCP/UDP port 53. Drain the node
# before changing this from false to true.
enable_network_acl = false
# Bound in-flight UDP requests and TCP connections before allocating handler
# goroutines or upstream sockets. A zero value uses these defaults.
dns_proxy_concurrency_limit = 256
dns_proxy_per_sandbox_concurrency_limit = 16

[plugin.resource]
# EXPERIMENTAL/DEBUG ONLY. Set true when /sys/fs/cgroup is read-only.
# Sandboxes then inherit the sandboxd process cgroup, and per-sandbox CPU,
# memory, and pids limits are not enforced. Only runsc is available.
disable_cgroup = false
# "shares" preserves relative CPU weighting. "quota" applies a CFS bandwidth
# limit and lets runsc and Kata derive CPU topology from the requested CPU.
cpu_limit_mode = "quota"
cgroup_cache_size = 1
# Maximum processes per sandbox. Omit or set to 0 for unlimited.
# pids_max = 4096
interface_cache_size = 1
cgroup_root_name = "/sandboxd"
max_instance_num = 32

[plugin.runtime]
# Retained for configuration compatibility; the current runtime does not read it.
image_lib_dir = "/var/lib/sandboxd/images"
# Writable gVisor overlays are stored in this shared directory. Leaving size
# unset uses an ordinary directory and requires no loop device. Setting a size
# creates a bounded ext4 filestore; enable XFS only when reflink is required.
filestore_dir = "/var/lib/sandboxd/filestore"
filestore_xfs_enabled = false
# Convert physical total and available bytes into scheduler-visible logical
# storage. This does not change the ext4/XFS mount size or requested quota.
filestore_overcommit_ratio = 1.0
# filestore_dir_size = "100G"
loop_device_dir = "/dev"
overlay_tmpfs_size = "256M"

[plugin.runtime.basic_spec]
# Empty uses sandboxd's built-in OCI base specification.
runsc = ""

[plugin.runtime.runtime_binary]
runsc = "/usr/local/bin/runsc"

[plugin.image]
root = "/var/lib/sandboxd/image-manager"
distill_fs_bin = "/usr/local/bin/distill_fs"
oss_template = "/etc/sandboxd/oss.json"
nydus_template = "/etc/sandboxd/registry.json"
nydus_suffix = "_nydus_v3"
oss_auths_path = "/etc/sandboxd/oss_auths.json"
registry_auths_path = "/etc/sandboxd/registry_auths.json"
cgroup_memory_limit = "0"

# The optional node-resource integration is intended for an AKernel node.
# Kubernetes is the backward-compatible default. Standalone deployments can
# select the read-only cgroup provider instead.
# [plugin.node_resource]
# provider = "kubernetes" # or "cgroup"
# sock_path = "/run/sandboxd/resource.sock"
